<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hologramme Stark AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #canvas3d { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
    #hud {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 3; color: #00f3ff; font-weight: bold; font-size: 14px;
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px #00f3ff;
      background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 20px;
      border: 1px solid #00f3ff; pointer-events: none; text-align: center;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">Recherche de main...</div>
  <video id="video" playsinline></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const hud = document.getElementById('hud');
    const videoElement = document.getElementById('video');
    const canvas3D = document.getElementById('canvas3d');

    // --- 1. INITIALISATION DE LA SCÈNE 3D (THREE.JS) ---
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Création du Cœur Holographique (Sphère + Icosaèdre en fil de fer lumineux)
    const holoGroup = new THREE.Group();

    const sphereGeo = new THREE.IcosahedronGeometry(1.2, 2);
    const sphereMat = new THREE.MeshBasicMaterial({
      color: 0x00f3ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });
    const holoCore = new THREE.Mesh(sphereGeo, sphereMat);
    holoGroup.add(holoCore);

    const innerGeo = new THREE.OctahedronGeometry(0.6, 0);
    const innerMat = new THREE.MeshBasicMaterial({
      color: 0xff0055,
      wireframe: true
    });
    const innerCore = new THREE.Mesh(innerGeo, innerMat);
    holoGroup.add(innerCore);

    scene.add(holoGroup);

    // --- 2. LOGIQUE DES GESTES ---
    let isPinching = false;

    function updateHologram(handLandmarks) {
      const indexTip = handLandmarks[8]; // Bout de l'index
      const thumbTip = handLandmarks[4]; // Bout du pouce

      // Convertir les coordonnées écran (0 à 1) vers l'espace 3D (-3 à +3)
      // On inverse X car la caméra est en mode miroir
      const targetX = - (indexTip.x - 0.5) * 6;
      const targetY = - (indexTip.y - 0.5) * 6;

      // Calcul de la distance entre le pouce et l'index
      const dx = indexTip.x - thumbTip.x;
      const dy = indexTip.y - thumbTip.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      // PINCEMENT : Si les doigts sont très proches (< 0.08)
      if (distance < 0.08) {
        if (!isPinching) {
          isPinching = true;
          sphereMat.color.setHex(0xffaa00); // Change la couleur en orange quand attrapé
          hud.innerText = "Hologramme Saisi !";
        }
        // Suivre la position du doigt
        holoGroup.position.x = targetX;
        holoGroup.position.y = targetY;
      } else {
        isPinching = false;
        sphereMat.color.setHex(0x00f3ff); // Couleur bleue de base
        hud.innerText = "Pince l'index et le pouce pour attraper";
      }

      // ÉTIRER / AGRANDIR : La taille dépend de l'écartement des doigts
      const scale = Math.max(0.5, Math.min(distance * 5, 2.5));
      holoGroup.scale.set(scale, scale, scale);
    }

    // --- 3. DÉTECTION HAND TRACKING (MEDIAPIPE) ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        updateHologram(results.multiHandLandmarks[0]);
      } else {
        hud.innerText = "Place ta main devant l'écran";
      }
    });

    // --- 4. CAMÉRA MOBILE ET BOUCLE D'ANIMATION ---
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    function animate() {
      requestAnimationFrame(animate);

      // Rotation continue de l'hologramme pour l'effet futuriste
      holoCore.rotation.y += 0.01;
      holoCore.rotation.x += 0.005;
      innerCore.rotation.y -= 0.03;

      renderer.render(scene, camera3D);
    }
    animate();

    // Redimensionnement automatique si tu tournes le téléphone
    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
