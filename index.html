<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hologramme Stark AR Multi-Caméra</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    .mirror { transform: scaleX(-1); }
    #canvas3d { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
    #hud {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 3; color: #00f3ff; font-weight: bold; font-size: 12px;
      text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 8px #00f3ff;
      background: rgba(0, 0, 0, 0.7); padding: 8px 16px; border-radius: 20px;
      border: 1px solid #00f3ff; pointer-events: none; text-align: center; width: 85%; max-width: 340px;
    }
    #controls {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      z-index: 3; display: flex; gap: 10px; width: 90%; justify-content: center;
    }
    .btn {
      background: rgba(0, 0, 0, 0.7); color: #00f3ff; border: 1px solid #00f3ff;
      padding: 12px 18px; border-radius: 12px; font-weight: bold; font-size: 12px;
      text-transform: uppercase; cursor: pointer; backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    .btn:active { background: rgba(0, 243, 255, 0.4); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">Initialisation de la caméra...</div>
  
  <div id="controls">
    <button id="switchCamBtn" class="btn">📷 Caméra: Avant</button>
    <button id="flashBtn" class="btn" style="display:none;">💡 Flash: OFF</button>
  </div>

  <video id="video" playsinline class="mirror"></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const hud = document.getElementById('hud');
    const videoElement = document.getElementById('video');
    const canvas3D = document.getElementById('canvas3d');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const flashBtn = document.getElementById('flashBtn');

    let currentStream = null;
    let facingMode = 'user'; // 'user' = avant, 'environment' = arrière
    let isTorchOn = false;

    // --- 1. CONFIGURATION DE LA SCÈNE 3D (THREE.JS) ---
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const mainHoloGroup = new THREE.Group();
    scene.add(mainHoloGroup);

    // --- HOLOGRAMME 1 : Caméra Avant (Sphère bleue et noyau rouge) ---
    const frontHoloGroup = new THREE.Group();
    const sphereGeo = new THREE.IcosahedronGeometry(1.2, 2);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.8 });
    const holoCore = new THREE.Mesh(sphereGeo, sphereMat);
    frontHoloGroup.add(holoCore);

    const innerGeo = new THREE.OctahedronGeometry(0.6, 0);
    const innerMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
    const innerCore = new THREE.Mesh(innerGeo, innerMat);
    frontHoloGroup.add(innerCore);

    // --- HOLOGRAMME 2 : Caméra Arrière (Nœud Quantique Vert & Anneau Doré) ---
    const rearHoloGroup = new THREE.Group();
    const torusGeo = new THREE.TorusKnotGeometry(0.8, 0.2, 100, 16);
    const torusMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.85 });
    const torusMesh = new THREE.Mesh(torusGeo, torusMat);
    rearHoloGroup.add(torusMesh);

    const ringGeo = new THREE.RingGeometry(1.3, 1.4, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, side: THREE.DoubleSide });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    rearHoloGroup.add(ringMesh);

    // Démarrer avec l'hologramme avant
    mainHoloGroup.add(frontHoloGroup);

    // --- 2. LOGIQUE DU SUIVI DE LA MAIN ET DES GESTES ---
    let isPinching = false;

    function updateHologram(handLandmarks) {
      const indexTip = handLandmarks[8];
      const thumbTip = handLandmarks[4];

      // Inverser la direction X si on est en caméra miroir (avant)
      const dirX = (facingMode === 'user') ? -1 : 1;
      const targetX = dirX * (indexTip.x - 0.5) * 6;
      const targetY = - (indexTip.y - 0.5) * 6;

      const dx = indexTip.x - thumbTip.x;
      const dy = indexTip.y - thumbTip.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      // Action quand on pince les doigts (< 0.08)
      if (distance < 0.08) {
        if (!isPinching) {
          isPinching = true;
          sphereMat.color.setHex(0xffaa00);
          torusMat.color.setHex(0xffaa00);
          hud.innerText = "Hologramme Saisi !";
        }
        mainHoloGroup.position.x = targetX;
        mainHoloGroup.position.y = targetY;
      } else {
        isPinching = false;
        sphereMat.color.setHex(0x00f3ff);
        torusMat.color.setHex(0x00ff88);
        hud.innerText = "Pince l'index et le pouce pour attraper";
      }

      // Taille dépendante de l'écartement des doigts
      const scale = Math.max(0.5, Math.min(distance * 5, 2.5));
      mainHoloGroup.scale.set(scale, scale, scale);
    }

    // --- 3. DÉTECTION INTELLIGENCE ARTIFICIELLE (MEDIAPIPE) ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        updateHologram(results.multiHandLandmarks[0]);
      } else {
        hud.innerText = "Place ta main devant la caméra";
      }
    });

    // --- 4. GESTION DES CAMÉRAS ET DU FLASH ---
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;
        await videoElement.play();

        // Gestion de l'affichage et changement d'hologramme
        if (facingMode === 'user') {
          videoElement.classList.add('mirror');
          switchCamBtn.innerText = "📷 Caméra: Avant";
          flashBtn.style.display = 'none';
          mainHoloGroup.clear();
          mainHoloGroup.add(frontHoloGroup);
        } else {
          videoElement.classList.remove('mirror');
          switchCamBtn.innerText = "📷 Caméra: Arrière";
          flashBtn.style.display = 'inline-block';
          mainHoloGroup.clear();
          mainHoloGroup.add(rearHoloGroup);
        }

        isTorchOn = false;
        flashBtn.innerText = "💡 Flash: OFF";
        processVideoFrame();
      } catch (err) {
        console.error(err);
        hud.innerText = "Erreur : Impossible d'accéder à la caméra";
      }
    }

    async function processVideoFrame() {
      if (videoElement.currentTime > 0 && !videoElement.paused && !videoElement.ended) {
        await hands.send({ image: videoElement });
      }
      requestAnimationFrame(processVideoFrame);
    }

    // Changement de caméra
    switchCamBtn.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // Activation du Flash (Lampe Torche)
    flashBtn.addEventListener('click', async () => {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          isTorchOn = !isTorchOn;
          await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
          flashBtn.innerText = isTorchOn ? "💡 Flash: ON" : "💡 Flash: OFF";
        } else {
          alert("Le flash n'est pas géré par le navigateur de ce téléphone.");
        }
      } catch (e) {
        alert("Impossible d'activer le flash.");
      }
    });

    // --- 5. ANIMATION CONTINUELLE ---
    function animate() {
      requestAnimationFrame(animate);

      // Animation Caméra Avant
      holoCore.rotation.y += 0.01;
      holoCore.rotation.x += 0.005;
      innerCore.rotation.y -= 0.03;

      // Animation Caméra Arrière
      torusMesh.rotation.y += 0.02;
      torusMesh.rotation.x += 0.01;
      ringMesh.rotation.z += 0.015;

      renderer.render(scene, camera3D);
    }

    // Lancement
    startCamera();
    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
