<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. AR Prototype System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    .mirror { transform: scaleX(-1); }
    #canvas3d { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
    
    /* Interface Futuristic HUD */
    #hud-panel {
      position: absolute; top: 15px; left: 15px; z-index: 3;
      color: #00f3ff; background: rgba(0, 15, 30, 0.75);
      border: 1px solid #00f3ff; border-radius: 8px; padding: 12px;
      width: 260px; backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); pointer-events: none;
    }
    .hud-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #ff0055; margin-bottom: 5px; }
    .hud-value { font-size: 13px; color: #00f3ff; margin-bottom: 3px; }
    .hud-status { font-size: 10px; color: #00ff88; }

    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 3; display: flex; gap: 8px; width: 95%; max-width: 400px; justify-content: center;
    }
    .btn {
      background: rgba(0, 20, 40, 0.8); color: #00f3ff; border: 1px solid #00f3ff;
      padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 11px;
      text-transform: uppercase; cursor: pointer; backdrop-filter: blur(5px);
    }
    .btn:active { background: #00f3ff; color: #000; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud-panel">
    <div class="hud-title">System J.A.R.V.I.S. v2.6</div>
    <div id="hud-target" class="hud-value">Cible: ARMURE MARK-85</div>
    <div id="hud-action" class="hud-value">Geste: En attente</div>
    <div id="hud-diag" class="hud-status">IA Vocale: Dites "Affiche", "Détacher"</div>
  </div>

  <div id="controls">
    <button id="voiceBtn" class="btn">🎙️ Parler à l'IA</button>
    <button id="switchCamBtn" class="btn">📷 Caméra</button>
    <button id="explodeBtn" class="btn">💥 Séparer</button>
  </div>

  <video id="video" playsinline class="mirror"></video>
  <canvas id="canvas3d"></canvas>

  <script>
    const hudTarget = document.getElementById('hud-target');
    const hudAction = document.getElementById('hud-action');
    const hudDiag = document.getElementById('hud-diag');
    const videoElement = document.getElementById('video');
    const canvas3D = document.getElementById('canvas3d');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const explodeBtn = document.getElementById('explodeBtn');
    const voiceBtn = document.getElementById('voiceBtn');

    let currentStream = null;
    let facingMode = 'user';
    let isExploded = false;

    // --- 1. MOTEUR 3D HIGH-PERFORMANCE ---
    const scene = new THREE.Scene();
    const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // DOSSARD / PROTO-ARMURE (Assemblage de modules 3D)
    const armorGroup = new THREE.Group();
    scene.add(armorGroup);

    // Module Central (Cœur ARC)
    const coreGeo = new THREE.OctahedronGeometry(0.5, 2);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    armorGroup.add(coreMesh);

    // Plaques d'Armure Dégageables (4 Modules Extérieurs)
    const plates = [];
    const plateGeo = new THREE.BoxGeometry(0.4, 0.8, 0.1);
    const plateMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });

    const positions = [
      { x: 1, y: 0, z: 0 }, { x: -1, y: 0, z: 0 },
      { x: 0, y: 1, z: 0 }, { x: 0, y: -1, z: 0 }
    ];

    positions.forEach((pos) => {
      const plate = new THREE.Mesh(plateGeo, plateMat);
      plate.userData = { origX: pos.x, origY: pos.y, origZ: pos.z };
      plate.position.set(pos.x, pos.y, pos.z);
      armorGroup.add(plate);
      plates.push(plate);
    });

    // Variables pour lissage ultra-fluide (LERP Math)
    let targetX = 0, targetY = 0, targetScale = 1;
    let currentX = 0, currentY = 0, currentScale = 1;

    // --- 2. TRAITEMENT DU SUIVI DES MAINS (OPTIMISÉ) ---
    function updateHandTracking(handLandmarks) {
      const indexTip = handLandmarks[8];
      const thumbTip = handLandmarks[4];

      const dirX = (facingMode === 'user') ? -1 : 1;
      targetX = dirX * (indexTip.x - 0.5) * 6;
      targetY = - (indexTip.y - 0.5) * 6;

      const dx = indexTip.x - thumbTip.x;
      const dy = indexTip.y - thumbTip.y;
      const distance = Math.hypot(dx, dy);

      // Détection Pince (Pinch)
      if (distance < 0.08) {
        hudAction.innerText = "Geste: Saisie & Manipulation";
        targetScale = 1.4;
        coreMat.color.setHex(0xffaa00);
      } else {
        hudAction.innerText = "Geste: Suivi Actif";
        targetScale = Math.max(0.6, Math.min(distance * 4, 2.2));
        coreMat.color.setHex(0x00f3ff);
      }
    }

    // --- 3. MEDIAPIPE LITE (SPEED CONFIGURATION) ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0, // 0 = LITE (Ultra-rapide sur mobile)
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        updateHandTracking(results.multiHandLandmarks[0]);
      } else {
        hudAction.innerText = "Geste: Recherche main...";
      }
    });

    // --- 4. FLUIDITÉ TONY STARK (BOUCLE DE LISSAGE PHYSIC) ---
    function animate() {
      requestAnimationFrame(animate);

      // Interpolation linéaire (LERP) pour éliminer les tremblements
      currentX += (targetX - currentX) * 0.15;
      currentY += (targetY - currentY) * 0.15;
      currentScale += (targetScale - currentScale) * 0.15;

      armorGroup.position.x = currentX;
      armorGroup.position.y = currentY;
      armorGroup.scale.set(currentScale, currentScale, currentScale);

      // Animations continues des sous-composants
      coreMesh.rotation.y += 0.02;
      coreMesh.rotation.z += 0.01;

      // Gestion de la séparation des pièces (Exploded View)
      plates.forEach((plate) => {
        const factor = isExploded ? 2.2 : 1.0;
        plate.position.x += (plate.userData.origX * factor - plate.position.x) * 0.1;
        plate.position.y += (plate.userData.origY * factor - plate.position.y) * 0.1;
        plate.rotation.y += 0.02;
      });

      renderer.render(scene, camera3D);
    }

    // --- 5. MODULE DE RECONNAISSANCE VOCALE (IA INTEGRATION) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.continuous = false;

      voiceBtn.addEventListener('click', () => {
        hudDiag.innerText = "IA: Écoute en cours...";
        recognition.start();
      });

      recognition.onresult = (event) => {
        const cmd = event.results[0][0].transcript.toLowerCase();
        hudDiag.innerText = `Commande: "${cmd}"`;

        if (cmd.includes("détacher") || cmd.includes("séparer")) {
          toggleExplode(true);
        } else if (cmd.includes("assembler") || cmd.includes("coller")) {
          toggleExplode(false);
        } else if (cmd.includes("analyse") || cmd.includes("calcul")) {
          hudDiag.innerText = "Probabilité impression 3D: 94.2% [Valide]";
        } else if (cmd.includes("affiche") || cmd.includes("armure")) {
          hudTarget.innerText = "Cible: PROTO-ARMURE MARK-85";
          armorGroup.visible = true;
        }
      };
    } else {
      voiceBtn.innerText = "Vocale non supportée";
    }

    function toggleExplode(state) {
      isExploded = (state !== undefined) ? state : !isExploded;
      explodeBtn.innerText = isExploded ? "🔗 Assembler" : "💥 Séparer";
      hudDiag.innerText = isExploded ? "Structure: Vue Éclatée" : "Structure: Compacte";
    }

    explodeBtn.addEventListener('click', () => toggleExplode());

    // --- 6. CAMÉRA & INITIALISATION ---
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        videoElement.srcObject = currentStream;
        await videoElement.play();

        if (facingMode === 'user') {
          videoElement.classList.add('mirror');
          switchCamBtn.innerText = "📷 Cam: Avant";
        } else {
          videoElement.classList.remove('mirror');
          switchCamBtn.innerText = "📷 Cam: Arrière";
        }
        processFrame();
      } catch (e) {
        hudDiag.innerText = "Erreur accès caméra";
      }
    }

    async function processFrame() {
      if (videoElement.currentTime > 0 && !videoElement.paused && !videoElement.ended) {
        await hands.send({ image: videoElement });
      }
      requestAnimationFrame(processFrame);
    }

    switchCamBtn.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    startCamera();
    animate();

    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
